spring.application.name=clickup-simplifier

# Serwer tylko lokalnie: endpoint ustawiajacy token nie moze byc osiagalny z sieci (F-01 / F2)
server.address=127.0.0.1

# ClickUp Simplifier - ustawienia rdzenia
clickup.settings-file=${user.home}/.clickup-simplifier/settings.json
clickup.api.base-url=https://api.clickup.com/api/v2

# Lokalna trwalosc (F-02) - lokalnie zainstalowany PostgreSQL (nadpisywalne przez env)
spring.datasource.url=jdbc:postgresql://localhost:5432/clickup_simplifier
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.enabled=true
# Lokalne credentials: stworz server/application-local.properties (ignorowany przez git)
spring.config.import=optional:file:./application-local.properties
